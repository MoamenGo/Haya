<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Khatwa (خطوة) mark: three steps rising (the steps already taken) and one
       dot just above them (the next step). Same drawing as BrandMark.tsx. -->
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14918a"/>
      <stop offset="1" stop-color="#0b5f5a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#k)"/>
  <path d="M13 48H24V38H34V28H44" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="18" r="5" fill="#5eead4"/>
</svg>
