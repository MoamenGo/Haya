<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="خطوة: مكان هادئ تنظّم فيه يومك وتكبر خطوة بخطوة" />
    <title>خطوة</title>
    <!--
      Loading screen: shown only until React draws the app (it replaces #root's
      content). Plain CSS here because the app's stylesheet isn't loaded yet.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
      }
      .boot svg {
        width: 56px;
        height: 56px;
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          background: #0b1220;
        }
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.6;
          transform: scale(0.96);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="خطوة">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#0f766e" />
          <path
            d="M13 48H24V38H34V28H44"
            fill="none"
            stroke="#fff"
            stroke-width="6.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="49" cy="18" r="5" fill="#5eead4" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
